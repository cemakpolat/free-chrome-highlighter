<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal Web Highlighter</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 400px;
      min-height: 500px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #fafbfc;
      color: #333;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      text-align: center;
    }

    .logo-text {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .tagline {
      font-size: 12px;
      opacity: 0.9;
    }

    .nav-tabs {
      display: flex;
      background: white;
      border-bottom: 1px solid #e9ecef;
    }

    .nav-tab {
      flex: 1;
      padding: 12px;
      border: none;
      background: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      color: #6c757d;
      transition: all 0.2s ease;
    }

    .nav-tab.active {
      color: #667eea;
      border-bottom: 2px solid #667eea;
    }

    .tab-content {
      display: none;
      padding: 20px;
    }

    .tab-content.active {
      display: block;
    }

    .action-card {
      background: white;
      border: 1px solid #e9ecef;
      border-radius: 8px;
      padding: 16px;
      margin: 12px 0;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .action-card:hover {
      border-color: #667eea;
      transform: translateY(-1px);
    }

    .action-icon {
      font-size: 20px;
      min-width: 24px;
    }

    .action-title {
      font-weight: 600;
      margin-bottom: 4px;
    }

    .action-subtitle {
      font-size: 12px;
      color: #6c757d;
    }

    .highlight-item {
      background: white;
      border: 1px solid #e9ecef;
      border-radius: 8px;
      padding: 12px;
      margin: 8px 0;
      border-left: 4px solid #ffd700;
    }

    .highlight-text {
      font-size: 14px;
      line-height: 1.4;
      margin-bottom: 8px;
      word-break: break-word;
    }

    .highlight-meta {
      font-size: 12px;
      color: #6c757d;
    }

    .no-results {
      text-align: center;
      color: #6c757d;
      padding: 40px 20px;
    }

    .hidden {
      display: none !important;
    }

    #searchResults {
      max-height: 300px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="logo-text">🎯 Web Highlighter</div>
    <div class="tagline">Highlight, organize, and sync</div>
  </div>

  <!-- Navigation -->
  <div class="nav-tabs">
    <button class="nav-tab active" data-tab="search">Highlights</button>
    <button class="nav-tab" data-tab="manage">Manage</button>
    <button class="nav-tab" data-tab="settings">Settings</button>
  </div>

  <!-- Search Tab -->
  <div class="tab-content active" id="search-tab">
    <div id="searchResults">
      <div class="no-results">
        <div>📝</div>
        <div>Loading highlights...</div>
      </div>
    </div>
  </div>

  <!-- Manage Tab -->
  <div class="tab-content" id="manage-tab">
    <div class="action-card" id="openManagerBtn">
      <span class="action-icon">📚</span>
      <div>
        <div class="action-title">Manage All Highlights</div>
        <div class="action-subtitle">View, search, and organize everything</div>
      </div>
    </div>

    <div class="action-card" id="syncBtn">
      <span class="action-icon">🔄</span>
      <div>
        <div class="action-title">Sync Now</div>
        <div class="action-subtitle">Backup and sync across devices</div>
      </div>
    </div>

    <div class="action-card" id="connectDriveBtn">
      <span class="action-icon">🔗</span>
      <div>
        <div class="action-title">Connect Google Drive</div>
        <div class="action-subtitle">Enable cloud sync</div>
      </div>
    </div>
  </div>

  <!-- Settings Tab -->
  <div class="tab-content" id="settings-tab">
    <div class="action-card" id="settingsBtn">
      <span class="action-icon">⚙️</span>
      <div>
        <div class="action-title">Extension Settings</div>
        <div class="action-subtitle">Configure preferences</div>
      </div>
    </div>
  </div>

  <script src="popup-working.js"></script>
</body>
</html>
