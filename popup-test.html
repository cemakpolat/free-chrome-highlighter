<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal Web Highlighter</title>
  <style>
    body {
      width: 400px;
      height: 300px;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
    }

    .test-content {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .btn {
      background: #4285f4;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      margin: 5px;
    }

    .btn:hover {
      background: #3367d6;
    }
  </style>
</head>
<body>
  <div class="test-content">
    <h2>🎯 Web Highlighter</h2>
    <p>Extension is working!</p>
    <button class="btn" id="testBtn">Test Button</button>
    <div id="status">Ready</div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      console.log('Test popup loaded');
      document.getElementById('testBtn').addEventListener('click', () => {
        document.getElementById('status').textContent = 'Button clicked!';
      });
    });
  </script>
</body>
</html>
