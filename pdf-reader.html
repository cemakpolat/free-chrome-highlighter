<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Reader & Highlighter</title>
  <link rel="stylesheet" href="design-tokens.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="pdf-reader.css">
</head>
<body>
  <div id="pdf-reader-container">
    <div class="pdf-toolbar" role="toolbar" aria-label="PDF viewer toolbar">
      <div class="pdf-toolbar-left">
        <button class="pdf-btn pdf-exit" id="pdf-exit" aria-label="Close PDF reader">✕ Exit</button>
        <span class="pdf-title" id="pdf-title" role="heading" aria-level="1">PDF Reader & Highlighter</span>
      </div>
      <div class="pdf-toolbar-right">
        <span id="pdf-highlight-count" class="pdf-highlight-count" aria-live="polite" aria-atomic="true">0 highlights</span>
        <button class="pdf-btn" id="pdf-search-toggle" title="Search PDF" aria-label="Toggle search panel">🔍 Search</button>
        <button class="pdf-btn" id="pdf-export-highlights" title="Export Highlights" aria-label="Export all highlights">📤 Export</button>
        <button class="pdf-btn" id="pdf-theme-toggle" title="Toggle Theme" aria-label="Toggle light/dark theme" aria-pressed="false">🌙</button>
        <button class="pdf-btn" id="pdf-download" title="Download PDF" aria-label="Download PDF file">💾 Download</button>
      </div>
    </div>

    <!-- Search Panel -->
    <div class="pdf-search-panel" id="pdf-search-panel" style="display: none;" role="search" aria-label="PDF search">
      <input type="text" id="pdf-search-input" placeholder="Search in PDF..." aria-label="Search text input">
      <button class="pdf-btn" id="pdf-search-prev" aria-label="Previous search result">↑</button>
      <button class="pdf-btn" id="pdf-search-next" aria-label="Next search result">↓</button>
      <span id="pdf-search-results" aria-live="polite" aria-atomic="true">0 / 0</span>
      <button class="pdf-btn" id="pdf-search-close" aria-label="Close search panel">✕</button>
    </div>

    <!-- Color Picker Panel -->
    <div class="pdf-color-picker" id="pdf-color-picker" role="group" aria-label="Highlight color selection">
      <div class="color-label">Highlight Color:</div>
      <button class="color-option" data-color="yellow" style="background: rgba(250, 204, 21, 0.4);" title="Yellow" aria-label="Yellow highlight"></button>
      <button class="color-option" data-color="green" style="background: rgba(34, 197, 94, 0.4);" title="Green" aria-label="Green highlight"></button>
      <button class="color-option" data-color="blue" style="background: rgba(59, 130, 246, 0.4);" title="Blue" aria-label="Blue highlight"></button>
      <button class="color-option" data-color="pink" style="background: rgba(236, 72, 153, 0.4);" title="Pink" aria-label="Pink highlight"></button>
      <button class="color-option" data-color="orange" style="background: rgba(251, 146, 60, 0.4);" title="Orange" aria-label="Orange highlight"></button>
    </div>

    <div class="pdf-main-content">
      <div class="pdf-viewer-section" role="main" aria-label="PDF viewer">
        <div id="pdf-canvas-container">
          <div class="loading-message" role="status" aria-live="polite">Loading PDF...</div>
        </div>
      </div>
    </div>

    <!-- Navigation controls -->
    <div class="pdf-controls" role="navigation" aria-label="PDF navigation">
      <button class="pdf-btn" id="pdf-prev-page" aria-label="Previous page">← Prev</button>
      <span class="pdf-page-info" id="pdf-page-info" aria-live="polite" aria-atomic="true">Page 1 of 1</span>
      <button class="pdf-btn" id="pdf-next-page" aria-label="Next page">Next →</button>
      <div class="pdf-zoom-controls" role="group" aria-label="Zoom controls">
        <button class="pdf-btn" id="pdf-zoom-out" aria-label="Zoom out">-</button>
        <span id="pdf-zoom-level" aria-live="polite" aria-atomic="true">100%</span>
        <button class="pdf-btn" id="pdf-zoom-in" aria-label="Zoom in">+</button>
      </div>
    </div>
  </div>

  <!-- Annotation Modal -->
  <div class="annotation-modal" id="annotation-modal" role="dialog" aria-labelledby="annotation-title" aria-modal="true">
    <div class="annotation-content">
      <h3 id="annotation-title">✏️ Add Note</h3>
      <label for="annotation-text" class="visually-hidden">Note text</label>
      <textarea id="annotation-text" placeholder="Type your note here..." aria-label="Note text"></textarea>
      <div class="annotation-actions">
        <button class="pdf-btn" id="annotation-cancel" aria-label="Cancel note">Cancel</button>
        <button class="pdf-btn" id="annotation-save" style="background: #4f46e5;" aria-label="Save note">Save Note</button>
      </div>
    </div>
  </div>

  <!-- Visually hidden helper class for screen readers -->
  <style>
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border-width: 0;
    }
  </style>

  <script src="lib/pdf.min.js"></script>
  <script src="pdf-reader.js"></script>
</body>
</html>
